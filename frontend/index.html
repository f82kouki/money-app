<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#FFE5EF" />
    <script>
      // 最初の描画の前に前回のテーマを当て、標準の色が一瞬見えるのを防ぐ（値は src/theme.ts が保存する）。
      try {
        var theme = JSON.parse(localStorage.getItem("warikan_theme"));
        if (theme) {
          for (var name in theme.variables) {
            document.documentElement.style.setProperty(name, theme.variables[name]);
          }
          document.querySelector('meta[name="theme-color"]').content = theme.metaColor;
        }
      } catch (e) {
        // 保存値が読めなければ標準の色のまま
      }
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <title>ねこあらの財布</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
